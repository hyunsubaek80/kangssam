<!doctype html>
<html>
<head>
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>강쌤철물 가격표</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 위에서 만든 데이터를 불러옵니다 -->
    <script src="data.js"></script>
</head>

<body>
	<div class="container">
		<!-- 왼쪽 빨간색 정보 영역 -->
		<div class="cont1">
			<div class="cont1_col_wrapper">
				<div class="cont1_col_top">
					<img src="img/title.png" alt="타이틀">
				</div>
			</div>
			<div class="gap160"></div>
			
			<div class="cont1_col_bottom">
				<div class="fixman">
					<img src="img/fixman.png" alt="캐릭터이미지">
				</div>
				<div class="price_title">
					<span>강쌤 설치 서비스</span>
				</div>
                <!-- 🌟 동적으로 가격 및 타이틀 정보가 들어갈 영역 -->
                <div id="dynamic-price-area"></div>
			</div>
		</div>

		<!-- 오른쪽 상세 이미지 영역 -->
		<div class="cont2">
			<div class="detail_navi">
				<div class="navi_content">
					<div class="inner_navi">
						<a href="index.html">Home</a>
						<i class="bi bi-chevron-right"></i>
						<a id="nav-category" href="#">카테고리</a>
					</div>
					<div class="btn_wrapper">
						<button class="btn-share" onclick="copyCurrentUrl()">
							<i class="bi bi-share"></i>
						</button>
						<a id="btn-home" href="#" class="btn_home">
							<i class="bi bi-house"></i>
						</a>
					</div>
				</div>
			</div>
            
            <!-- 🌟 동적으로 제품 이미지가 나열될 영역 -->
			<div class="cont2_top" id="img-container">
				<!-- <img src="img/..." alt="제품이미지"> -->
			</div>
            
            <!-- 🌟 동적으로 하단 제품명/판매가격이 들어갈 영역 -->
			<div class="cont2_bottom" id="desc-container">
				<!-- data.js의 descHtml 내용 삽입 -->
			</div>
		</div>
	</div>

	<script src="share.js"></script>
    <script>
        // 1. URL에서 '?id=제품코드' 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        
        // 2. data.js 에서 제품 정보 찾기
        const item = productData[productId];

        if (!item) {
            alert('제품 정보를 찾을 수 없거나 업데이트 중입니다.');
            window.location.href = 'index.html'; // 없으면 메인으로 튕겨내기
        } else {
            // 3. 네비게이션 적용
            document.getElementById('nav-category').innerText = item.categoryName;
            document.getElementById('nav-category').href = item.categoryLink;
            document.getElementById('btn-home').href = item.categoryLink;

            // 4. 왼쪽 가격/텍스트 영역 렌더링
            document.getElementById('dynamic-price-area').innerHTML = item.priceHtml;

            // 5. 오른쪽 여러개 이미지 렌더링
            let imgTags = '';
            item.images.forEach(src => {
                imgTags += `<img src="${src}" alt="제품이미지">`;
            });
            document.getElementById('img-container').innerHTML = imgTags;

            // 6. 우측 하단 설명 영역 (도어락처럼 설명이 없으면 영역 자체를 숨김)
            const descContainer = document.getElementById('desc-container');
            if (item.descHtml.trim() !== "") {
                descContainer.innerHTML = item.descHtml;
                descContainer.style.display = 'block';
            } else {
                descContainer.style.display = 'none';
            }
        }
    </script>
</body>
</html>
